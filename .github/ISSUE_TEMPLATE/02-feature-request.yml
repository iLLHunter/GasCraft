name: Feature Request
description: Suggest a feature or improvement for the Minecraft mod.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for the mod? Check existing issues first, then describe
        what players or server owners would gain from your suggestion.

  - type: textarea
    id: use-case
    attributes:
      label: What problem or need does this address?
      description: Describe the gameplay, world generation, administration, or modpack use case.
      placeholder: "When playing/configuring a world, I want to ... because ..."
    validations:
      required: true

  - type: textarea
    id: proposed-feature
    attributes:
      label: Proposed feature or behavior
      description: Explain what you would like the mod to do and how it should work for the player or server admin.
      placeholder: "Add an option / command / item / generation behavior that ..."
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature area
      options:
        - World generation / dimensions / biomes
        - Blocks / items / crafting recipes
        - Configuration / datapacks
        - Commands / interface / user experience
        - Compatibility with other mods
        - Performance / server administration
        - Other
    validations:
      required: false

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version (if relevant)
      description: Mention which versions this should support, if applicable.
      placeholder: "e.g. 1.21.1"
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: Example or suggested implementation
      description: Optional screenshots, example configurations, commands, recipes, or interaction details.
      placeholder: "For example, a JSON config entry could ..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Are there existing ways to achieve this or similar features in other mods?
    validations:
      required: false
